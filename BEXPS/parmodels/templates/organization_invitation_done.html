{% extends "base.html" %}
{% block title %}Приглашение создано{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h1 class="h4 mb-2">Приглашение создано</h1>
    <p class="text-secondary">
      Ссылка действует до {{ invitation.expires_at }}. Email-рассылка пока не настроена, ссылку можно передать сотруднику вручную.
    </p>
    <label class="form-label" for="inviteUrl">Ссылка приглашения</label>
    <input class="form-control mb-3" id="inviteUrl" value="{{ invite_url }}" readonly>
    <a class="btn btn-primary" href="{% url 'parmodels:users_list' %}">К пользователям</a>
  </div>
</div>
{% endblock %}
