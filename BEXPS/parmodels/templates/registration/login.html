{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Вход в BEXPS</h1>
        <div class="text-secondary mb-4">Авторизация через стандартную Django-аутентификацию</div>

        {% if form.errors %}
          <div class="alert alert-danger">Проверьте логин и пароль.</div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Логин</label>
            <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}" autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
            <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}">
          </div>

          <button class="btn btn-primary w-100" type="submit">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
